// Build script of every Fabric version (see settings.gradle); `stonecutter.current` is the version being built.
plugins {
	// Both Loom variants ship in the same artifact. Minecraft 26.1+ is no longer obfuscated and builds
	// without remapping; older versions need the remapping variant and Mojang's mappings.
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'maven-publish'
}

def minecraftVersion = stonecutter.current.version
def obfuscated = !stonecutter.current.parsed.matches('>=26.1')
def javaVersion = obfuscated ? 21 : 25
// 1.21.1 has no Music Frequency option, so MusicFrequencyMixin has no target there (its source is commented out).
def excludedMixins = stonecutter.current.parsed.matches('>1.21.1') ? [] : ['MusicFrequencyMixin']

apply plugin: obfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

version = "${project.mod_version}+${minecraftVersion}"
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-fabric"
}

repositories {
	// Cloth Config (config screen library).
	maven { url = 'https://maven.shedaniel.me/' }
	// Mod Menu.
	maven { url = 'https://maven.terraformersmc.com/releases/' }
}

loom {
	// Client-only mod: keep everything in the main source set so client classes are visible.
	mods {
		"musiccurator" {
			sourceSet sourceSets.main
		}
	}
	// Every version shares the dev run directory at the repository root (config, options, worlds).
	// A world opened by a newer version cannot be loaded back by an older one.
	runConfigs.client.runDir = '../../run'
}

// Client game tests live in src/gametest. They launch the game, so they are not part of `build`: run them
// with ./gradlew :<version>-fabric:runClientGameTest. Fabric API only has the client game test API since 1.21.4.
if (stonecutter.current.parsed.matches('>=1.21.4')) {
	fabricApi {
		configureTests {
			createSourceSet = true
			modId = "musiccurator-gametest"
			enableGameTests = false
		}
	}
}

// The remapping variant only remaps mods declared through its mod* configurations.
def modConfiguration = { String name -> obfuscated ? "mod${name.capitalize()}" : name }

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	if (obfuscated) {
		mappings loom.officialMojangMappings()
	}

	add modConfiguration('implementation'), "net.fabricmc:fabric-loader:${project.loader_version}"
	add modConfiguration('implementation'), "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Cloth Config is required for the settings screen. Exclude its bundled Fabric API.
	add(modConfiguration('implementation'), "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: 'net.fabricmc.fabric-api')
	}

	// Mod Menu is optional for users; only needed to compile the config button hook and to test in dev.
	add modConfiguration('compileOnly'), "com.terraformersmc:modmenu:${project.modmenu_version}"
	add modConfiguration('runtimeOnly'), "com.terraformersmc:modmenu:${project.modmenu_version}"
}

// The mods a player installs next to this one, as published (not remapped for development).
configurations {
	productionMods {
		transitive = false
	}
}

dependencies {
	productionMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	productionMods "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
}

// Runs the built jar the way a player's launcher does: on obfuscated versions this checks the mixins
// against the production (intermediary) names, which the development runs never use. The transformed
// classes are exported to <run dir>/.mixin.out for inspection.
tasks.register('runProductionClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	mods.from(tasks.named(obfuscated ? 'remapJar' : 'jar'))
	mods.from(configurations.productionMods)
	runDir = layout.buildDirectory.dir('run/productionClient')
	jvmArgs.add('-Dmixin.debug.export=true')
}

processResources {
	def props = [
			"version"  : project.version,
			"minecraft": project.minecraft_dependency,
			"java"     : javaVersion
	]
	inputs.properties props
	inputs.property "excludedMixins", excludedMixins

	filesMatching("fabric.mod.json") {
		expand props
	}
	// Mixin refuses to start when the declared level is above the running Java version.
	filesMatching("musiccurator.mixins.json") {
		expand "java": "JAVA_${javaVersion}"
		filter { line -> excludedMixins.any { line.contains("\"${it}\"") } ? null : line }
	}
	exclude "META-INF/neoforge.mods.toml"
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

jar {
	def projectName = rootProject.name
	inputs.property "projectName", projectName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
