# Increase memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with the configuration cache.
org.gradle.configuration-cache=false

# Stonecutter recommends the Kotlin DSL and warns on every build otherwise; the build stays in Groovy
# like the rest of the project.
dev.kikugie.stonecutter.hard_mode=true

# Fabric (see https://fabricmc.net/develop)
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod
mod_version=1.3.0
maven_group=com.musiccurator
archives_base_name=music-curator

# Minecraft-specific versions (Fabric API, Cloth Config, Mod Menu) live in versions/<version>/gradle.properties.
